<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PP Availables</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sticky Header -->
    <header class="header">
        <div class="header-content">
            <div class="logo-section">
                <img src="images/logo.png" alt="PP Availables" class="logo-img">
                <div class="brand-text">
                    <h1 class="site-name">PP Availables</h1>
                    <p class="tagline">Discover amazing products at great prices. Your one-stop shop for quality finds!</p>
                </div>
            </div>
            <div class="social-links">
                <a href="https://www.instagram.com/pp.availables/" target="_blank" rel="noopener noreferrer" class="social-link" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.youtube.com/@pp.availables" target="_blank" rel="noopener noreferrer" class="social-link" title="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
                <a href="https://in.pinterest.com/yourusefulgadgets/" target="_blank" rel="noopener noreferrer" class="social-link" title="Pinterest">
                    <i class="fab fa-pinterest"></i>
                </a>
            </div>
        </div>
    </header>

    <!-- Search Bar -->
    <section class="search-section">
        <div class="search-container">
            <div class="search-wrapper">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Search products by name or description...">
                <button id="searchBtn" class="search-btn">Search</button>
                <button id="clearBtn" class="clear-btn" style="display: none;">Clear</button>
            </div>
        </div>
    </section>

    <!-- Main Content - Product Grid -->
    <main class="main-content">
        <div class="container">
            <div id="productGrid" class="product-grid">
                <!-- Products will be dynamically loaded here -->
            </div>
            <div id="noResults" class="no-results" style="display: none;">
                <i class="fas fa-search"></i>
                <p>No products found matching your search.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-social">
                <a href="https://www.instagram.com/pp.availables/" target="_blank" rel="noopener noreferrer" class="social-link" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.youtube.com/@pp.availables" target="_blank" rel="noopener noreferrer" class="social-link" title="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
                <a href="https://in.pinterest.com/yourusefulgadgets/" target="_blank" rel="noopener noreferrer" class="social-link" title="Pinterest">
                    <i class="fab fa-pinterest"></i>
                </a>
            </div>
            <p class="copyright">&copy; 2026 PP Availables. All rights reserved.</p>
        </div>
    </footer>

    <script src="products.js"></script>
    <script src="script.js"></script>
</body>
</html>
